version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cv-workspace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cv_workspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cv-workspace-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/cv_workspace
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      AI_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cv-workspace-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
