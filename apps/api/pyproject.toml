[project]
name = "cv-workspace-api"
version = "0.2.0"
description = "FastAPI backend for CV Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.4.0,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13.0,<2",
    "pyyaml>=6.0.1,<7",
    "python-multipart>=0.0.9,<1",
    "jinja2>=3.1.4,<4",
    "httpx>=0.27.0,<1",
    "playwright>=1.51.0,<2",
    "psycopg2-binary>=2.9.10,<3",
    "pypdf>=5.0.0,<7",
    "python-docx>=1.2.0,<2",
    "cryptography>=50.0.2,<51",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.6.0,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N815", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
