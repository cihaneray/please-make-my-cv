name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event.deleted == false &&
      (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[RELEASE:'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release request and main ancestry
        id: release
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/release_metadata.py

  publish:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create tag and publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: bash scripts/publish-release.sh
