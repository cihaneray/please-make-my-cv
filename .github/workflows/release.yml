name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event.deleted == false &&
      (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[RELEASE:'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release request and main ancestry
        id: release
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/release_metadata.py

  publish:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for an already published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve image names and Docker version tag
        if: steps.existing.outputs.published != 'true'
        id: images
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          version="${version/+/-build.}"
          if [ "${#version}" -gt 128 ]; then
            echo 'Docker image tag exceeds 128 characters.' >&2
            exit 1
          fi
          {
            echo "api=ghcr.io/${repository}-api"
            echo "web=ghcr.io/${repository}-web"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.published != 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.existing.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish API image
        if: steps.existing.outputs.published != 'true'
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          target: production
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.images.outputs.api }}:${{ steps.images.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api
      - name: Build and publish web image
        if: steps.existing.outputs.published != 'true'
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          target: runner
          platforms: linux/amd64
          build-args: API_INTERNAL_URL=http://api:8000
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.images.outputs.web }}:${{ steps.images.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        if: steps.existing.outputs.published != 'true'
      - name: Sign published image digests
        if: steps.existing.outputs.published != 'true'
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "$API_IMAGE@$API_DIGEST"
          cosign sign --yes "$WEB_IMAGE@$WEB_DIGEST"
      - name: Package build-free Compose installation
        if: steps.existing.outputs.published != 'true'
        id: bundle
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: python3 scripts/package_release.py
      - name: Verify installation from published image digests
        if: steps.existing.outputs.published != 'true'
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          unzip 'dist/*.zip' -d "$RUNNER_TEMP/cv-release-install"
          cp "$RUNNER_TEMP/cv-release-install/.env.example" "$RUNNER_TEMP/cv-release-install/.env"
          docker compose --project-directory "$RUNNER_TEMP/cv-release-install" -p cv-release-smoke up -d --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:3000/api/health
      - name: Remove isolated installation check
        if: always() && steps.bundle.outcome == 'success'
        run: docker compose --project-directory "$RUNNER_TEMP/cv-release-install" -p cv-release-smoke down --volumes
      - name: Create tag and publish release with generated notes
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          RELEASE_ASSET_DIR: dist
        run: bash scripts/publish-release.sh
