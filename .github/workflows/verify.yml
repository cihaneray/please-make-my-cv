name: Verify workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  commit-policy:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[SKIP]') }}
    runs-on: ubuntu-latest
    outputs:
      run-ci: ${{ steps.policy.outputs.run-ci }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check latest commit message
        id: policy
        shell: bash
        run: |
          if git log -1 --format=%B | grep -Fqi '[SKIP]'; then
            echo 'run-ci=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run-ci=true' >> "$GITHUB_OUTPUT"
          fi
  quality:
    needs: commit-policy
    if: ${{ needs.commit-policy.outputs.run-ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m unittest discover -s extensions/tests -v
      - run: pip install uv==0.12.23
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run playwright install --with-deps chromium
        working-directory: apps/api
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q && uv run python scripts/generate_types.py --check
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run lint && npm test
        working-directory: apps/web
  containers:
    needs: commit-policy
    if: ${{ needs.commit-policy.outputs.run-ci == 'true' }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-ci-password
      CV_DB_PASSWORD: disposable-ci-app-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.test.yml config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://127.0.0.1:8000/api/health && curl --fail http://127.0.0.1:3000/api/health
      - run: |
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --wait --wait-timeout 240
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:3000/api/health
      - if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down --volumes
